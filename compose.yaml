name: windowwise

services:
  signaling:
    build:
      context: .
      dockerfile: src/WindowWise.Signaling/Dockerfile

    env_file:
      - .env.server

    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5047
      ASPNETCORE_ENVIRONMENT: Production
      ReverseProxy__Address: "172.30.50.3"

    ports:
      - "127.0.0.1:5047:5047"

    networks:
      backend:
        ipv4_address: 172.30.50.2

    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest

    command:
      - tunnel
      - --no-autoupdate
      - run

    env_file:
      - .env.tunnel

    depends_on:
      - signaling

    networks:
      backend:
        ipv4_address: 172.30.50.3

    restart: unless-stopped

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.50.0/24
